name: build-windows

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Unit tests (ffmpeg-dependent tests skip if absent)
        run: go test ./...

      - name: Build Windows exe
        run: wails build -platform windows/amd64 -clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videocat-windows
          path: build/bin/videocat.exe
          if-no-files-found: error
